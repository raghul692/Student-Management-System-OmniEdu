name: OmniEdu CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: |
          npm ci || npm install
          cd server && npm ci && npx prisma generate
          cd ../client && npm ci

      - name: Server Typecheck
        run: |
          cd server && npm run typecheck

      - name: Client Production Build & Bundle Audit
        run: |
          cd client && npm run build

  backend-tests:
    name: Backend Test Suite, Smoke Tests & Release Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omniedu_test
          POSTGRES_PASSWORD: omniedu_test_secret
          POSTGRES_DB: omniedu_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci
          npx prisma generate

      - name: Push Schema & Seed Test DB
        env:
          DATABASE_URL: postgresql://omniedu_test:omniedu_test_secret@localhost:5432/omniedu_test_db?schema=public
          REDIS_URL: redis://localhost:6379
        run: |
          cd server
          npx prisma db push
          npx prisma db seed

      - name: Run Vitest Suite (100% Pass Required across all 11 suites)
        env:
          DATABASE_URL: postgresql://omniedu_test:omniedu_test_secret@localhost:5432/omniedu_test_db?schema=public
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: |
          cd server
          npm test

      - name: Run Production Smoke Test
        env:
          DATABASE_URL: postgresql://omniedu_test:omniedu_test_secret@localhost:5432/omniedu_test_db?schema=public
          REDIS_URL: redis://localhost:6379
        run: |
          cd server
          npx tsx scripts/smoke-test.ts

      - name: Run Database Backup & Restore Dry-Run Verification
        env:
          DATABASE_URL: postgresql://omniedu_test:omniedu_test_secret@localhost:5432/omniedu_test_db?schema=public
        run: |
          cd server
          npx tsx scripts/backup-database.ts
          npx tsx scripts/restore-database.ts --verify-only

      - name: Run Production Release Gate Audit
        env:
          DATABASE_URL: postgresql://omniedu_test:omniedu_test_secret@localhost:5432/omniedu_test_db?schema=public
          REDIS_URL: redis://localhost:6379
        run: |
          cd server
          npm run release:check

  docker-build-verification:
    name: Docker Multi-Stage Container Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: omniedu-api:latest

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: omniedu-web:latest
