version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omniedu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-omniedu_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-omniedu_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-omniedu_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-omniedu_user} -d ${DB_NAME:-omniedu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniedu-network

  redis:
    image: redis:7-alpine
    container_name: omniedu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniedu-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: omniedu-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-omniedu_user}:${DB_PASSWORD:-omniedu_secure_password_2026}@postgres:5432/${DB_NAME:-omniedu_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-omniedu_prod_access_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-omniedu_prod_refresh_secret_2026}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-omniedu_prod_storage_secret_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - server_backups:/app/backups
    ports:
      - "5000:5000"
    networks:
      - omniedu-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: omniedu-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - omniedu-network

volumes:
  postgres_data:
  redis_data:
  server_uploads:
  server_backups:

networks:
  omniedu-network:
    driver: bridge
